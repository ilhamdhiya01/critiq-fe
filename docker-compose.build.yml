# Override for building locally instead of pulling from GHCR.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative path: single origin, no CORS, and the same image works on
        # any domain. Inlined at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: critiq-fe:local
    pull_policy: build
