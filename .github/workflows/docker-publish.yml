name: Build and publish image

on:
  push:
    branches: [development, staging, main]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate on lint/test/build before publishing — same pattern as the BE repo.
  # Requires ci.yml to declare `on: workflow_call:` alongside its push/PR
  # triggers; see note below.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push to GHCR
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # development -> :development, staging -> :staging (what each stack's
      # compose on the VPS pulls, see `deploy`). main -> :main + :latest.
      # Every push also gets a :sha-<short> tag.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # NEXT_PUBLIC_* is inlined at `next build`, so the API base must be a
      # build-arg here — the VPS .env cannot change it at runtime. FE and BE
      # share one domain behind Nginx, so a relative path is correct for
      # every environment (dev, staging, prod).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SSHes into the VPS and recreates the FE container in this branch's
  # stack. Each GitHub environment (development, staging) sets DEPLOY_DIR to
  # its own absolute folder, whose docker-compose.yml pins the matching tag
  # (`critiq-fe:development` / `critiq-fe:staging`) with
  # `pull_policy: always`; the `pull` here makes the fetch explicit and fails
  # the job loudly if GHCR auth is broken.
  # Secrets (repo level): VPS_HOST, VPS_USER, VPS_SSH_KEY.
  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      # Each environment deploys to its own folder (vars.DEPLOY_DIR). No
      # DEPLOY_DIR (production until it exists) = no deploy, so a push to
      # main can never land on another environment's stack.
      - name: Pull and restart on VPS
        if: ${{ vars.DEPLOY_DIR != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_DIR
          script: |
            set -e
            cd "$DEPLOY_DIR"
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
