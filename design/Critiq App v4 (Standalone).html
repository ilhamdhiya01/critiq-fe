document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#EDEDED;flex:1\">{{ b.branch }}<\u002Fspan>\n          <span style=\"display:inline-flex;background:#161616;border:1px solid #2A2A2A;border-radius:7px;padding:2px;gap:2px\">\n            <span sc-camel-on-click=\"{{ b.m.on }}\" title=\"Require Manual Review — only manual review is allowed for PRs targeting this branch\" style=\"padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;background:{{ b.m.bg }};color:{{ b.m.c }}\">Manual only<\u002Fspan>\n            <span sc-camel-on-click=\"{{ b.a.on }}\" title=\"Allow AI-Assisted — reviewer chooses Manual or AI-Assisted mode per PR\" style=\"padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;background:{{ b.a.bg }};color:{{ b.a.c }}\">Allow AI<\u002Fspan>\n            <span sc-camel-on-click=\"{{ b.b.on }}\" title=\"Require Both — AI analysis and manual review must both run before approval\" style=\"padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;background:{{ b.b.bg }};color:{{ b.b.c }}\">Require both<\u002Fspan>\n          <\u002Fspan>\n          <span sc-camel-on-click=\"{{ b.remove }}\" title=\"Unprotect branch\" style=\"cursor:pointer;color:#5A5A5A;display:flex;padding:4px;border-radius:5px\" style-hover=\"color:#F87171;background:rgba(239,68,68,.10)\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid #191919\">\n        <input value=\"{{ branchInput }}\" sc-camel-on-change=\"{{ setBranchInput }}\" placeholder=\"Branch name or pattern, e.g. release/*\" style=\"flex:1;background:#161616;border:1px solid #2A2A2A;border-radius:6px;color:#E8E8E8;font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 12px;outline:none\" style-focus=\"border-color:#4A4A6A\">\n        <span sc-camel-on-click=\"{{ addBranch }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:#262626;border:1px solid #333;color:#E8E8E8;white-space:nowrap\" style-hover=\"background:#303030\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add Branch<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid #191919;flex-wrap:wrap\">\n        <span style=\"font-size:11px;color:#6E6E6E\">From repo:<\u002Fspan>\n        <sc-for list=\"{{ suggList }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <span sc-camel-on-click=\"{{ s.add }}\" style=\"font-size:11.5px;font-family:'JetBrains Mono',monospace;color:#9A9A9A;background:#181818;border:1px solid #262626;border-radius:999px;padding:3px 10px;cursor:pointer\" style-hover=\"color:#E8E8E8;border-color:#3A3A3A\">+ {{ s.name }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;align-items:center;padding:12px 20px\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6E6E6E\" stroke-width=\"1.6\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11.5px;color:#8A8A8A\">Final approval is always manual, regardless of review mode selected.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;overflow:hidden\">\n      <div style=\"display:flex;justif \u002Fsc-if>\n          <sc-if value=\"{{ m.editable }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"position:relative;display:inline-flex\">\n              <span sc-camel-on-click=\"{{ m.toggleMenu }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 11px;border:1px solid #2A2A2A;background:#161616;border-radius:6px;cursor:pointer\" style-hover=\"background:#1D1D1D;border-color:#3A3A3A\">\n                <span style=\"font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.04em;color:#C5C5C5\">{{ m.role }}<\u002Fspan>\n                <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6E6E6E\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <sc-if value=\"{{ m.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <span sc-camel-on-click=\"{{ m.closeMenu }}\" style=\"position:fixed;inset:0;z-index:70\"><\u002Fspan>\n                <span style=\"position:absolute;top:calc(100% + 5px);right:0;z-index:80;width:260px;background:#1A1A1A;border:1px solid #2E2E2E;border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column;padding:4px\">\n                  <sc-for list=\"{{ m.roleOpts }}\" as=\"ro\" hint-placeholder-count=\"3\">\n                    <span sc-camel-on-click=\"{{ ro.on }}\" style=\"display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;background:{{ ro.bgRow }}\" style-hover=\"background:#202020\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A5B4FC\" stroke-width=\"2.5\" style=\"flex:none;margin-top:2px;opacity:{{ ro.ckOp }}\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                      <span style=\"display:flex;flex-direction:column;gap:2px;text-align:left\">\n                        <span style=\"font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.04em;color:#E8E8E8\">{{ ro.name }}<\u002Fspan>\n                        <span style=\"font-size:10.5px;color:#7A7A7A;line-height:1.45\">{{ ro.desc }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ m.locked }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ m.roleStyle }}\">{{ m.role }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ isViewer }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11.5px;color:#6E6E6E;padding-top:10px\">Only Admins can invite members or change roles in this organization.<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ LOGIN ============ -->\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:#0A0A0A;z-index:300;display:flex;font-size:13px\">\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 24px;overflow:auto\">\n        <div style=\"width:360px;max-width:100%;display:flex;flex-direction:column\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M17.8 6.2A8 8 0 1 0 17.8 17.8\" stroke=\"#6366F1\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M16.6 16.6l4 4\" stroke=\"#A5B4FC\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.14em;color:#F5F5F5\">CRITIQ<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:28px 0 0;font-size:22px;font-weight:600;color:#F5F5F5;letter-spacing:-.01em\">Welcome to Critiq<\u002Fh1>\n          <p style=\"margin:8px 0 0;font-size:13px;color:#8A8A8A;line-height:1.5\">Connect your code host to log in or create an account.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:12px;margin:28px 0 0\">\n            <div style=\"flex:1;height:1px;background:#2A2A2A\"><\u002Fdiv>\n            <span style=\"font-size:12px;color:#7A7A7A;white-space:nowrap\">Log in / sign up with<\u002Fspan>\n            <div style=\"flex:1;height:1px;background:#2A2A2A\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:24px\">\n            <div sc-camel-on-click=\"{{ lgGh }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;background:#161616;border:1px solid #2A2A2A;border-radius:7px;padding:11px 0;cursor:pointer;font-size:13.5px;font-weight:600;color:#F0F0F0\" style-hover=\"background:#1D1D1D;border-color:#3A3A3A\">{{ lgGhIcon }}<span>Continue with GitHub<\u002Fspan><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ lgGl }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;background:#161616;border:1px solid #2A2A2A;border-radius:7px;padding:11px 0;cursor:pointer;font-size:13.5px;font-weight:600;color:#F0F0F0\" style-hover=\"background:#1D1D1D;border-color:#3A3A3A\">{{ lgGlIcon }}<span>Continue with GitLab.com<\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n          <p style=\"margin:26px 0 0;font-size:12px;color:#7A7A7A;text-align:center;line-height:1.5\">By logging in, you agree to our <a href=\"#\" style=\"color:#A5B4FC\">Terms of Service<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.1;position:relative;overflow:hidden;background:linear-gradient(160deg,#26264F 0%,#1B1B38 55%,#141428 100%);border-left:1px solid #2A2A2A;display:{{ lgBrandDisplay }};align-items:center\">\n        <svg width=\"640\" height=\"640\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.07\"><path d=\"M17.8 6.2A8 8 0 1 0 17.8 17.8\" stroke=\"#A5B4FC\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M16.6 16.6l4 4\" stroke=\"#6366F1\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <div style=\"position:relative;padding:0 72px;max-width:560px;display:flex;flex-direction:column\">\n          <h2 style=\"margin:0;font-size:30px;line-height:1.25;font-weight:700;color:#F5F5F5;letter-spacing:-.015em;text-wrap:pretty\">Every pull request reviewed before a human reads it.<\u002Fh2>\n          <p style=\"margin:16px 0 0;font-size:14.5px;line-height:1.65;color:#B8BAE0;text-wrap:pretty\">Critiq runs your rules and quality profiles against every PR, flags what matters, and keeps the noise out of review.<\u002Fp>\n          <div style=\"display:flex;gap:40px;margin-top:44px;padding-top:28px;border-top:1px solid rgba(165,180,252,.18)\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:#F0F0F0\">2,400+<\u002Fspan><span style=\"font-size:12px;color:#9295C9\">rules across 12 languages<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:#F0F0F0\">&lt; 90s<\u002Fspan><span style=\"font-size:12px;color:#9295C9\">median review time per PR<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ONBOARDING ============ -->\n  <sc-if value=\"{{ isOnboarding }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:#0A0A0A;z-index:200;display:flex;align-items:center;justify-content:center;overflow:auto\">\n      <div style=\"width:580px;max-width:94vw;display:flex;flex-direction:column;gap:24px;padding:30px 0\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:10px\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M17.8 6.2A8 8 0 1 0 17.8 17.8\" stroke=\"#6366F1\" stroke-width=\"2.6\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M16.6 16.6l4 4\" stroke=\"#A5B4FC\" stroke-width=\"2.6\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.14em;color:#F5F5F5\">CRITIQ<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;gap:16px;flex-wrap:wrap\">\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ ob.d2 }}\"><\u002Fspan><span style=\"font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;color:{{ ob.d2 }}\">1 · ORGANIZATION<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ ob.d3 }}\"><\u002Fspan><span style=\"font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;color:{{ ob.d3 }}\">2 · REPOSITORIES<\u002Fspan><\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ ob.d4 }}\"><\u002Fspan><span style=\"font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;color:{{ ob.d4 }}\">3 · BRANCH POLICY<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#111111;border:1px solid #232323;border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n                    <sc-if value=\"{{ ob.is2 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600\">Name your organization<\u002Fspan><span style=\"font-size:12px;color:#7A7A7A\">{{ ob.orgHint }}<\u002Fspan><\u002Fdiv>\n            <input value=\"{{ ob.orgName }}\" sc-camel-on-change=\"{{ ob.setOrgName }}\" placeholder=\"e.g. Cititex Engineering\" style=\"background:#161616;border:1px solid #2A2A2A;border-radius:7px;color:#E8E8E8;font-size:13px;padding:10px 14px;outline:none\">\n            <div style=\"display:flex;align-items:center;gap:10px;font-size:11.5px;font-family:'JetBrains Mono',monospace\"><span style=\"color:#6E6E6E\">URL<\u002Fspan><span style=\"color:#A5B4FC\">critiq.app/{{ ob.orgSlug }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.07);border-radius:8px\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A5B4FC\" stroke-width=\"1.8\" style=\"flex:none;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 11v5M12 8v.5\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:12px;color:#B8BAE0;line-height:1.55\">The organization is created when you press Continue — you become its <span style=\"color:#C7D2FE;font-weight:600\">Admin<\u002Fspan>. Repositories, members and policies stay inside it; invite teammates later from Settings → Members.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ob.is3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600\">Choose repositories to monitor<\u002Fspan><span style=\"font-size:12px;color:#7A7A7A\">{{ ob.repoHint }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ ob.ghGate }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid #2A2A2A;background:#0E0E0E;border-radius:8px\">\n                <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"{{ ob.ghPill }}\">GITHUB<\u002Fspan><span style=\"font-size:13px;font-weight:600\">Connect GitHub<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:12px;color:#9A9A9A;line-height:1.55\">Install the Critiq GitHub App on your organization or account. GitHub will ask which repositories to grant — you can change this later. You'll be sent back here when it's done.<\u002Fspan>\n                <sc-if value=\"{{ ob.ghPending }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;gap:10px;align-items:center;padding:11px 14px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.07);border-radius:8px\">\n                    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FBBF24\" stroke-width=\"1.8\" style=\"flex:none\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"font-size:12px;color:#E5D3A8;line-height:1.5;flex:1\">Waiting for your GitHub organization owner to approve the installation.<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ ob.ghCheck }}\" style=\"font-size:11.5px;color:#FBBF24;cursor:pointer;white-space:nowrap\" style-hover=\"color:#FDE68A\">Check again<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;justify-content:flex-end\"><span sc-camel-on-click=\"{{ ob.ghInstall }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:{{ ob.ghCur }};background:{{ ob.ghBg }};color:{{ ob.ghC }}\">{{ ob.ghLabel }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ob.gate }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid rgba(252,109,38,.35);background:rgba(252,109,38,.05);border-radius:8px\">\n                <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"{{ ob.glPill }}\">GITLAB<\u002Fspan><span style=\"font-size:13px;font-weight:600\">Connect your GitLab instance<\u002Fspan><\u002Fdiv>\n                <span style=\"font-size:12px;color:#9A9A9A;line-height:1.55\">Critiq lists your projects and installs webhooks with an access token. A <span style=\"color:#E0E0E0\">group access token<\u002Fspan> is recommended — it belongs to the group, so scans keep running when people leave. A personal access token works too.<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Instance URL<\u002Fspan><input value=\"{{ ob.glUrl }}\" sc-camel-on-change=\"{{ ob.setGlUrl }}\" placeholder=\"https://gitlab.com\" style=\"background:#161616;border:1px solid {{ ob.glUrlBd }};border-radius:6px;color:#E8E8E8;font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 12px;outline:none\" style-focus=\"border-color:#4A4A6A\">\n                  <sc-if value=\"{{ ob.glUrlErr }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;gap:6px;align-items:flex-start;font-size:11px;color:#F87171;line-height:1.5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F87171\" stroke-width=\"2\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg><span>{{ ob.glUrlErrMsg }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ ob.glUrlOk }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px;color:#6E6E6E\">Keep <span style=\"font-family:'JetBrains Mono',monospace;color:#9A9A9A\">gitlab.com<\u002Fspan> unless your team runs a self-hosted instance.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Access token<\u002Fspan><input value=\"{{ ob.glToken }}\" sc-camel-on-change=\"{{ ob.setGlToken }}\" placeholder=\"glpat-••••••••••••••••\" style=\"background:#161616;border:1px solid {{ ob.glTokBd }};border-radius:6px;color:#E8E8E8;font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 12px;outline:none\" style-focus=\"border-color:#4A4A6A\">\n                  <sc-if value=\"{{ ob.glErr }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;gap:6px;align-items:flex-start;font-size:11px;color:#F87171;line-height:1.5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F87171\" stroke-width=\"2\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg><span>{{ ob.glErrMsg }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n                  <span style=\"font-size:11px;color:#6E6E6E;line-height:1.5\">Group or personal access token · role <span style=\"font-family:'JetBrains Mono',monospace;color:#9A9A9A\">Maintainer<\u002Fspan> · scope <span style=\"font-family:'JetBrains Mono',monospace;color:#9A9A9A\">api<\u002Fspan>. GitLab enforces expiry — Critiq warns Admins 14 days before. <a href=\"#\" style=\"color:#A5B4FC\">How to create one<\u002Fa><\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end\"><span sc-camel-on-click=\"{{ ob.glVerify }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:{{ ob.glVfCur }};background:{{ ob.glVfBg }};color:{{ ob.glVfC }}\">{{ ob.glVfLabel }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ob.connected }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #232323;background:#0E0E0E;border-radius:8px\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:#22C55E;flex:none\"><\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\"><span style=\"font-size:12px;color:#E0E0E0;font-family:'JetBrains Mono',monospace\">{{ ob.srcLabel }}<\u002Fspan><span style=\"font-size:11px;color:#7A7A7A\">{{ ob.srcNote }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ ob.isGL }}\" hint-placeholder-val=\"{{ false }}\"><span sc-camel-on-click=\"{{ ob.glChange }}\" style=\"font-size:11.5px;color:#8A8A8A;cursor:pointer\" style-hover=\"color:#E8E8E8\">Change<\u002Fspan><\u002Fsc-if>\n              <span style=\"{{ ob.srcPill }}\">{{ ob.srcPillLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ ob.loading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px solid #232323;border-radius:8px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px\">\n                {{ ob.spinner }}\n                <span style=\"font-size:12px;color:#8A8A8A;font-family:'JetBrains Mono',monospace\">{{ ob.loadingLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ob.loaded }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px solid #232323;border-radius:8px;max-height:250px;overflow:auto\">\n              <sc-for list=\"{{ ob.list }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-bottom:1px solid #1D1D1D;background:{{ c.rowBg }}\">\n                  <div sc-camel-on-click=\"{{ c.on }}\" style=\"display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer\" style-hover=\"background:#1B1B1B\">\n                    <span style=\"width:16px;height:16px;border-radius:4px;border:1px solid {{ c.bxBd }};background:{{ c.bxBg }};display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#052E12\" stroke-width=\"3.2\" style=\"opacity:{{ c.ckOp }}\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#EDEDED;flex:1\">{{ c.name }}<\u002Fspan>\n                    <span style=\"display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8A8A8A\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ c.dot }}\"><\u002Fspan>{{ c.lang }}<\u002Fspan>\n                    <span style=\"{{ c.visStyle }}\">{{ c.vis }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ c.fetching }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:8px;padding:0 14px 11px 42px;font-size:11px;color:#6E6E6E;font-family:'JetBrains Mono',monospace\">{{ c.fetchLabel }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.showBr }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:10px;padding:0 14px 11px 42px;position:relative\">\n                      <span style=\"font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em;flex:none\">Monitor<\u002Fspan>\n                      <span sc-camel-on-click=\"{{ c.brToggle }}\" style=\"display:inline-flex;align-items:center;gap:8px;flex:1;min-width:0;background:#161616;border:1px solid #2A2A2A;border-radius:6px;padding:6px 10px;cursor:pointer\" style-hover=\"border-color:#3A3A3A\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color
