document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

splay: swap;\n  src: url(\"50239924-be41-4e3d-8ec0-cdc96c1b2fe7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5a63e1c1-f8f3-4760-a080-3834d342c149\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;background:#050505;color:#E8E8E8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif}\na{color:#A5B4FC;text-decoration:none}a:hover{color:#C7D2FE}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}\n@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}\n@keyframes bar{0%{left:-40%;width:40%}50%{width:30%}100%{left:100%;width:20%}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"padding:48px 56px;display:flex;flex-direction:column;gap:56px;min-width:1500px\">\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6366F1;font-weight:600\">CRITIQ · LOADING STATES<\u002Fspan>\n    <span style=\"font-size:26px;font-weight:700;color:#F5F5F5;letter-spacing:-.01em\">General loading system<\u002Fspan>\n    <span style=\"font-size:13px;color:#8A8A8A;max-width:760px;line-height:1.55\">Three primitives (Spinner, Skeleton, Progress bar), five compositions. Rule of thumb: skeleton when the layout is known, spinner when it is not, inline spinner for actions, top bar for navigation. Never stack two loaders in one view.<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- 1. Primitives -->\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #1E1E1E;padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6366F1;font-weight:600\">01<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#F0F0F0\">Primitives<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">components/ui/Spinner · Skeleton · ProgressBar<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:16px;width:340px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Spinner · sizes 14 / 18 / 24 / 32<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:22px\">{{ sp14 }}{{ sp18 }}{{ sp24 }}{{ sp32 }}<\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;line-height:1.5\">Track <span style=\"font-family:'JetBrains Mono',monospace;color:#B5B5B5\">#4A4A4A<\u002Fspan>, arc <span style=\"font-family:'JetBrains Mono',monospace;color:#B5B5B5\">#A5B4FC<\u002Fspan>, stroke 2.5, 0.8s linear. On light buttons arc is <span style=\"font-family:'JetBrains Mono',monospace;color:#B5B5B5\">#111111<\u002Fspan>.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:16px;width:420px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Skeleton · text / pill / avatar / block<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"height:12px;width:70%;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n          <div style=\"height:12px;width:45%;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center;margin-top:4px\">\n            <div style=\"width:28px;height:28px;border-radius:50%;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n            <div style=\"height:18px;width:92px;border-radius:999px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n            <div style=\"height:18px;width:60px;border-radius:999px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:64px;width:100%;border-radius:6px;margin-top:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;line-height:1.5\">Base <span style=\"font-family:'JetBrains Mono',monospace;color:#B5B5B5\">#1A1A1A<\u002Fspan>, highlight <span style=\"font-family:'JetBrains Mono',monospace;color:#B5B5B5\">#242424<\u002Fspan>, shimmer 1.6s. Radius follows the real element (4 text, 6 block, 999 pill).<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:16px;width:420px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Progress bar · indeterminate / determinate<\u002Fspan>\n        <div style=\"height:2px;background:#1E1E1E;border-radius:2px;position:relative;overflow:hidden\"><div style=\"position:absolute;top:0;bottom:0;background:#6366F1;border-radius:2px;animation:bar 1.4s ease-in-out infinite\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"height:4px;background:#1E1E1E;border-radius:2px;overflow:hidden\"><div style=\"width:62%;height:100%;background:#6366F1;border-radius:2px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:#7A7A7A\"><span>Scanning 28 of 44 branches<\u002Fspan><span>62%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;line-height:1.5\">2px indeterminate for route transitions (top of content area). 4px determinate only when a real count exists.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 2. Compositions -->\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #1E1E1E;padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6366F1;font-weight:600\">02<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#F0F0F0\">Compositions<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">where each one is used<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start\">\n\n      <!-- A: app boot -->\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6366F1;font-weight:600;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);border-radius:4px;padding:1px 6px\">A<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F0F0F0\">App boot<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">/ resolver · auth check · org resolve<\u002Fspan><\u002Fdiv>\n        <div style=\"width:520px;height:340px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:30px;height:30px;border-radius:7px;background:#6366F1;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#fff\">C<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;letter-spacing:.18em;color:#F5F5F5\">CRITIQ<\u002Fspan><\u002Fdiv>\n          {{ sp18 }}\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6E6E6E\">Loading your workspace…<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;max-width:520px;line-height:1.5\">Only before the shell exists (session + org lookup). Show after 300ms delay to avoid flash. Never used inside the shell.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- B: page skeleton (table) -->\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6366F1;font-weight:600;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);border-radius:4px;padding:1px 6px\">B<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F0F0F0\">Page skeleton · list pages<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">/pull-requests · /repositories · /activity<\u002Fspan><\u002Fdiv>\n        <div style=\"width:860px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;display:flex;overflow:hidden\">\n          <div style=\"width:180px;flex:none;border-right:1px solid #1C1C1C;background:#0D0D0D;padding:14px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:10px\"><span style=\"width:22px;height:22px;border-radius:5px;background:#6366F1;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff\">CE<\u002Fspan><span style=\"font-weight:600;color:#F5F5F5\">Cititex Eng.<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:6px 8px;color:#9A9A9A\">Dashboard<\u002Fdiv>\n            <div style=\"padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:#F5F5F5\">Pull Requests<\u002Fdiv>\n            <div style=\"padding:6px 8px;color:#9A9A9A\">Repositories<\u002Fdiv>\n            <div style=\"padding:6px 8px;color:#9A9A9A\">Rules<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n            <div style=\"height:2px;position:relative;overflow:hidden;background:transparent\"><div style=\"position:absolute;top:0;bottom:0;background:#6366F1;animation:bar 1.4s ease-in-out infinite\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"height:46px;border-bottom:1px solid #1C1C1C;display:flex;align-items:center;padding:0 22px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:#F5F5F5\">Pull Requests<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:flex;gap:8px\">\n                <div style=\"height:28px;width:64px;border-radius:6px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                <div style=\"height:28px;width:78px;border-radius:6px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                <div style=\"height:28px;width:118px;border-radius:6px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;overflow:hidden\">\n                <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 90px 100px 130px 70px;padding:9px 16px;font-size:10px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid #1D1D1D;font-family:'JetBrains Mono',monospace\"><span>Pull request<\u002Fspan><span>Critical<\u002Fspan><span>Review<\u002Fspan><span>Status<\u002Fspan><span style=\"text-align:right\">Updated<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 90px 100px 130px 70px;align-items:center;padding:13px 16px;border-bottom:1px solid #191919\">\n                    <span style=\"display:flex;flex-direction:column;gap:6px;padding-right:24px\">\n                      <div style=\"height:11px;border-radius:4px;width:{{ r.w1 }};background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                      <div style=\"height:9px;border-radius:4px;width:{{ r.w2 }};background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                    <\u002Fspan>\n                    <div style=\"height:10px;width:22px;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                    <div style=\"height:10px;width:64px;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#1F1F1F\"><\u002Fspan><div style=\"height:10px;width:70px;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv><\u002Fspan>\n                    <div style=\"height:10px;width:34px;margin-left:auto;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;max-width:860px;line-height:1.5\">Shell, header and column labels render immediately. Rows = 5 skeleton rows mirroring real column widths. 2px indeterminate bar at the top of the content area during route change. Filter counts are skeletons until data arrives.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- C: dashboard skeleton -->\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6366F1;font-weight:600;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);border-radius:4px;padding:1px 6px\">C<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F0F0F0\">Card skeleton · dashboard / detail<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">/ · /pull-requests/:id · /repositories/:id<\u002Fspan><\u002Fdiv>\n        <div style=\"width:680px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"height:9px;width:{{ k.l }};border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n                <div style=\"height:24px;width:{{ k.v }};border-radius:5px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#111111;border:1px solid #232323;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Recent findings<\u002Fspan><div style=\"height:9px;width:60px;border-radius:4px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"height:110px;border-radius:6px;background:linear-gradient(90deg,#1A1A1A 0%,#242424 50%,#1A1A1A 100%);background-size:600px 100%;animation:shimmer 1.6s linear infinite\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;max-width:680px;line-height:1.5\">Card chrome (border, section label) is real; only values are skeleton. KPI value block 24px tall matches the real number size. Charts become one block.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- D: inline / section -->\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6366F1;font-weight:600;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);border-radius:4px;padding:1px 6px\">D<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F0F0F0\">Inline section · lazy data<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">branch dropdown · repo list fetch · rescan<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n          <div style=\"width:320px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Block · known label<\u002Fspan>\n            <div style=\"border:1px solid #232323;border-radius:8px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px\">{{ sp18 }}<span style=\"font-size:12px;color:#8A8A8A;font-family:'JetBrains Mono',monospace\">Fetching repositories from GitHub…<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:320px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Dropdown panel<\u002Fspan>\n            <div style=\"background:#141414;border:1px solid #2A2A2A;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)\">\n              <div style=\"padding:8px 10px;border-bottom:1px solid #222\"><div style=\"height:28px;border-radius:6px;border:1px solid #2A2A2A;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#5A5A5A\">Search branches…<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#7A7A7A\">{{ sp14 }}Loading branches…<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:320px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8A8A;text-transform:uppercase;letter-spacing:.07em\">Row · background job<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;background:#111111;border:1px solid #232323;border-radius:8px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#EDEDED;flex:1\">critiq-core<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#A5B4FC\">{{ sp14 }}Scanning…<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;background:#111111;border:1px solid #232323;border-radius:8px;opacity:.55\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#EDEDED;flex:1\">payments-api<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#8A8A8A;animation:pulse 1.6s ease-in-out infinite\"><span style=\"width:7px;height:7px;border-radius:50%;background:#8A8A8A\"><\u002Fspan>Queued<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#7A7A7A;max-width:1000px;line-height:1.5\">Spinner 18 + mono label when the section has no fixed shape. Spinner 14 inline for dropdowns and rows. Label always says what is loading and from where. Queued items pulse, active items spin.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- E: buttons -->\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6366F1;font-weight:600;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);border-radius:4px;padding:1px 6px\">E<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F0F0F0\">Button loading<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6E6E6E\">submit · verify · redirect · destructive<\u002Fspan><\u002Fdiv>\n        <div style=\"width:680px;background:#0A0A0A;border:1px solid #232323;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Primary · idle<\u002Fspan><div style=\"height:38px;border-radius:6px;background:#E8E8E8;color:#111111;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600\">Continue<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Primary · loading<\u002Fspan><div style=\"height:38px;border-radius:6px;background:#E8E8E8;color:#111111;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;cursor:not-allowed\">{{ spDark }}Saving…<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Primary · disabled<\u002Fspan><div style=\"height:38px;border-radius:6px;background:#1E1E1E;color:#5A5A5A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:not-allowed\">Continue<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Secondary · loading<\u002Fspan><div style=\"height:38px;border-radius:6px;border:1px solid #2A2A2A;color:#C5C5C5;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;cursor:not-allowed\">{{ sp14 }}Verifying…<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Provider · redirect<\u002Fspan><div style=\"height:38px;border-radius:6px;background:#1E1E1E;color:#5A5A5A;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;cursor:not-allowed\">{{ sp14 }}Redirecting to GitHub…<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6E6E6E;text-transform:uppercase;letter-spacing:.07em\">Destructive · loading<\u002Fspan><div style=\"height:38px;border-radius:6px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#F87171;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;cursor:not-allowed\">{{ spRed }}Removing…<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:12px;color:#7A7A7A;line-height:1.5\">Width stays fixed (no jump). Label changes to present progressive with ellipsis. Click and hover disabled; `aria-busy=true`. Spinner 14 replaces the leading icon, never appended after text.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 3. Rules -->\n  <div style=\"display:flex;flex-direction:column;gap:18px;max-width:1000px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #1E1E1E;padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6366F1;font-weight:600\">03<\u002Fspan><span style=\"font-size:17px;font-weight:600;color:#F0F0F0\">Rules<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px 24px;font-size:13px;line-height:1.55\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Delay<\u002Fspan><span style=\"color:#C5C5C5\">Show any loader after 300ms. Under that, render nothing (avoids flash on cached responses).<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Minimum<\u002Fspan><span style=\"color:#C5C5C5\">Once shown, keep visible ≥ 400ms so it doesn't flicker.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Choice<\u002Fspan><span style=\"color:#C5C5C5\">Layout known → skeleton (B, C). Unknown → spinner + label (D). Action → button (E). Route → top bar. Boot → A.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">One at a time<\u002Fspan><span style=\"color:#C5C5C5\">Never a page skeleton and a top bar and a spinner together. Page skeleton already implies loading.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Refetch<\u002Fspan><span style=\"color:#C5C5C5\">Data already on screen stays. Background refresh shows only the 2px bar; rows dim to opacity .6, never re-skeleton.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Labels<\u002Fspan><span style=\"color:#C5C5C5\">JetBrains Mono, 11.5–12px, #8A8A8A. Say what and from where: \"Fetching repositories from GitHub…\". No generic \"Loading…\" inside the shell.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Motion<\u002Fspan><span style=\"color:#C5C5C5\">Spinner 0.8s linear · shimmer 1.6s · pulse 1.6s · bar 1.4s. Honor <span style=\"font-family:'JetBrains Mono',monospace\">prefers-reduced-motion<\u002Fspan>: skeleton static, spinner keeps spinning.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A5B4FC\">Timeout<\u002Fspan><span style=\"color:#C5C5C5\">After 15s, replace loader with error state + Retry. Never spin forever.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  spin(sz,arc,track){\n    return React.createElement('svg',{key:'s'+sz+arc,width:sz,height:sz,viewBox:'0 0 24 24',fill:'none',style:{animation:'spin .8s linear infinite',flex:'none'}},\n      React.createElement('circle',{cx:12,cy:12,r:9,stroke:track||'#4A4A4A',strokeWidth:2.5}),\n      React.createElement('path',{d:'M12 3a9 9 0 0 1 9 9',stroke:arc||'#A5B4FC',strokeWidth:2.5,strokeLinecap:'round'}));\n  }\n  renderVals(){\n    return {\n      sp14:this.spin(14),sp18:this.spin(18),sp24:this.spin(24),sp32:this.spin(32),\n      spDark:this.spin(14,'#111111','rgba(17,17,17,.25)'),\n      spRed:this.spin(14,'#F87171','rgba(248,113,113,.3)'),\n      rows:[{w1:'58%',w2:'40%'},{w1:'72%',w2:'44%'},{w1:'46%',w2:'36%'},{w1:'64%',w2:'42%'},{w1:'52%',w2:'38%'}],\n      kpis:[{l:'60%',v:'40%'},{l:'50%',v:'55%'},{l:'70%',v:'35%'},{l:'55%',v:'45%'}]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
