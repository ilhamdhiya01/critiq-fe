services:
  web:
    image: ghcr.io/ilhamdhiya01/critiq-fe:${IMAGE_TAG:-development}
    pull_policy: always
    container_name: critiq-fe
    restart: unless-stopped

    # Loopback only: the host's nginx is the sole public entrypoint. Binding
    # 0.0.0.0 here would expose this port directly, bypassing Cloudflare.
    ports:
      - "127.0.0.1:3100:3000"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # NEXT_PUBLIC_API_URL is deliberately absent. It is inlined at image
      # build time; setting it here has no effect. Change it via build-args
      # and rebuild the image.

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
